name: Daily Counterpoint Tracker

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  track-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run Scraper Script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python script.py

    - name: Commit Memory State Updates Back to Repo
      run: |
        if [ -f sync_status.txt ] && grep -q "update_committed" sync_status.txt; then
          git config --global user.name "GitHub Automation Bot"
          git config --global user.email "actions@github.com"
          git add processed_links.txt
          git commit -m "Automated Sync: Memory state update"
          git push
        else
          echo "No new historical deliveries tracked. Aborting commit sync."
        fi
