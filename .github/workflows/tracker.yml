name: Daily Blog Tracker

on:
  schedule:
    - cron: '30 9 * * *'    # 9:30 AM UTC = 3:00 PM IST
    - cron: '30 15 * * *'   # 3:30 PM UTC = 9:00 PM IST
  workflow_dispatch:

jobs:
  track-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 tzdata

    - name: Run Scraper Script
      id: scraper
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python -u script.py

    - name: Upload Tracker Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tracker-logs
        path: tracker.log
        retention-days: 30
        if-no-files-found: warn

    - name: Commit Memory State Updates Back to Repo
      if: always()
      run: |
        git config --global user.name "GitHub Automation Bot"
        git config --global user.email "actions@github.com"
        git add processed_*.txt notified_message.txt
        if ! git diff --cached --quiet; then
          git commit -m "Automated Sync: memory state update"
          git push
        else
          echo "No state changes. Skipping commit."
        fi
