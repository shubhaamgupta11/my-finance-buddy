name: Daily Counterpoint Tracker

on:
  schedule:
    # Runs everyday at 09:00 AM UTC (2:30 PM IST)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows you to test it manually via the GitHub interface button

jobs:
  track-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial permission allowing GitHub to commit memory back to code

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/checkout@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run Scraper Script
      env:
        CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
      run: python script.py

    - name: Commit State Back to Repo (Memory Management)
      run: |
        # If script flags that it found a new link, save it to the master code line
        if [ -f sync_status.txt ] && grep -q "update_committed" sync_status.txt; then
          git config --global user.name "GitHub Automation Bot"
          git config --global user.email "actions@github.com"
          git add last_link.txt
          git commit -m "Automated Sync: Updated last processed blog link"
          git push
        else
          echo "No new updates found. Skipping repository commit state change."
        fi
