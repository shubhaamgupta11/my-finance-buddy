name: Daily Counterpoint Tracker

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  track-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run Scraper Script
      id: scraper
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python script.py

    - name: Upload Tracker Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tracker-logs
        path: tracker.log
        retention-days: 30
        if-no-files-found: warn

    - name: Commit Memory State Updates Back to Repo
      if: always()
      run: |
        if [ -f sync_status.txt ] && grep -q "update_committed" sync_status.txt; then
          git config --global user.name "GitHub Automation Bot"
          git config --global user.email "actions@github.com"
          git add processed_links.txt
          if ! git diff --cached --quiet; then
            git commit -m "Automated Sync: Memory state update"
            git push
          else
            echo "No changes to commit (state already up to date)."
          fi
        else
          echo "No new historical deliveries tracked. Aborting commit sync."
        fi
